<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.95em;
        }
        .diagram-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-x: auto;
            max-width: 100%;
        }
        svg {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
        }
        .entidad {
            fill: #f1c40f;
            stroke: #b7950b;
            stroke-width: 2;
        }
        .entidad-texto {
            fill: #1a1a1a;
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .atributo {
            fill: #ffffff;
            stroke: #2980b9;
            stroke-width: 1.5;
        }
        .atributo-texto {
            fill: #2c3e50;
            font-size: 10px;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .pk {
            stroke: #e67e22;
            stroke-width: 2.2;
        }
        .pk-texto {
            text-decoration: underline;
        }
        .relacion {
            fill: #5dade2;
            stroke: #2874a6;
            stroke-width: 1.8;
        }
        .relacion-texto {
            fill: #ffffff;
            font-size: 10px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .linea {
            stroke: #34495e;
            stroke-width: 1.6;
            fill: none;
        }
        .linea-atributo {
            stroke: #7f8c8d;
            stroke-width: 1;
            fill: none;
        }
        .cardinalidad {
            fill: #c0392b;
            font-size: 10px;
            font-weight: bold;
        }
        .nota {
            margin-top: 20px;
            color: #555;
            font-size: 0.85em;
            text-align: center;
            max-width: 950px;
            line-height: 1.6;
        }
        .leyenda {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
            font-size: 0.8em;
        }
        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-box {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid #999;
        }
    </style>
</head>
