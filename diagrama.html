<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagrama ER - Completo para Captura</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            color: #000000;
        }

        .diagram-container {
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
        }

        svg {
            background-color: #ffffff;
            border: 1px solid #cccccc;
        }

        /* Estilos ER */
        .entity { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
        .entity-text { font-size: 15px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
        .attribute { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
        .attr-text { font-size: 12px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
        .pk-text { text-decoration: underline; font-weight: bold; }
        .card-text { font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; }
        .line { stroke: #000000; stroke-width: 2; }
        .relation { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
        .relation-text { font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    </style>
</head>
<body>

    <div class="diagram-container">
        <svg width="2200" height="1500" viewBox="0 0 2200 1500">

            <!-- ========================================================= -->
            <!-- LÍNEAS DE CONEXIÓN PRINCIPALES -->
            <!-- ========================================================= -->

            <!-- Fila Superior: CARRERA -> PERTENECE -> ESTUDIANTE -> ESTUDIA -> ASIGNATURA -> IMPARTE -> DOCENTE -->
            <line x1="220" y1="200" x2="350" y2="200" class="line"/>
            <line x1="470" y1="200" x2="600" y2="200" class="line"/>
            <line x1="780" y1="200" x2="900" y2="200" class="line"/>
            <line x1="1020" y1="200" x2="1150" y2="200" class="line"/>
            <line x1="1330" y1="200" x2="1450" y2="200" class="line"/>
            <line x1="1570" y1="200" x2="1700" y2="200" class="line"/>

            <!-- ESTUDIANTE -> INSCRIPCIÓN -->
            <line x1="690" y1="230" x2="690" y2="520" class="line"/>

            <!-- INSCRIPCIÓN -> REALIZA -> PAGO MATRÍCULA -->
            <line x1="600" y1="550" x2="470" y2="550" class="line"/>
            <line x1="350" y1="550" x2="220" y2="550" class="line"/>

            <!-- SECRETARIA -> REGISTRA -> PAGO MATRÍCULA -->
            <line x1="130" y1="780" x2="130" y2="700" class="line"/>
            <line x1="130" y1="620" x2="130" y2="580" class="line"/>

            <!-- INSCRIPCIÓN -> GENERA -> HISTORIAL -->
            <line x1="780" y1="550" x2="900" y2="550" class="line"/>
            <line x1="1020" y1="550" x2="1150" y2="550" class="line"/>

            <!-- HISTORIAL -> TIENE -> EVALUACIÓN PARCIAL -->
            <line x1="1240" y1="580" x2="1240" y2="820" class="line"/>

            <!-- EVALUACIÓN PARCIAL -> TIENE -> RECUPERACIÓN -->
            <line x1="1330" y1="850" x2="1450" y2="850" class="line"/>
            <line x1="1570" y1="850" x2="1700" y2="850" class="line"/>

            <!-- EVALUACIÓN PARCIAL -> APLICA -> USUARIO -->
            <line x1="1240" y1="880" x2="1240" y2="1120" class="line"/>

            <!-- USUARIO -> TIENE -> ROL -->
            <line x1="1330" y1="1150" x2="1450" y2="1150" class="line"/>
            <line x1="1570" y1="1150" x2="1700" y2="1150" class="line"/>

            <!-- GESTIÓN ACADÉMICA / PRERREQUISITO -->
            <line x1="1240" y1="170" x2="1240" y2="110" class="line"/>
            <line x1="2000" y1="200" x2="2000" y2="300" class="line"/>
            <line x1="2000" y1="360" x2="2000" y2="450" class="line"/>


            <!-- ========================================================= -->
            <!-- LÍNEAS DE ATRIBUTOS (CONECTORES A ELIPSES) -->
            <!-- ========================================================= -->

            <!-- Atributos CARRERA -->
            <line x1="130" y1="170" x2="50" y2="90" class="line"/><line x1="130" y1="170" x2="130" y2="80" class="line"/><line x1="130" y1="170" x2="210" y2="90" class="line"/>

            <!-- Atributos ESTUDIANTE (CORREGIDOS: Conexión exacta al borde superior) -->
            <line x1="630" y1="170" x2="480" y2="80" class="line"/>
            <line x1="650" y1="170" x2="570" y2="80" class="line"/>
            <line x1="670" y1="170" x2="650" y2="80" class="line"/>
            <line x1="710" y1="170" x2="730" y2="80" class="line"/>
            <line x1="730" y1="170" x2="810" y2="80" class="line"/>
            <line x1="750" y1="170" x2="900" y2="80" class="line"/>

            <!-- Atributos ASIGNATURA -->
            <line x1="1240" y1="170" x2="1100" y2="80" class="line"/><line x1="1240" y1="170" x2="1190" y2="80" class="line"/><line x1="1240" y1="170" x2="1280" y2="80" class="line"/><line x1="1240" y1="170" x2="1370" y2="80" class="line"/>

            <!-- Atributos DOCENTE -->
            <line x1="1790" y1="170" x2="1680" y2="80" class="line"/><line x1="1790" y1="170" x2="1760" y2="80" class="line"/><line x1="1790" y1="170" x2="1840" y2="80" class="line"/><line x1="1790" y1="170" x2="1920" y2="80" class="line"/>

            <!-- Atributos INSCRIPCIÓN -->
            <line x1="600" y1="550" x2="490" y2="460" class="line"/><line x1="600" y1="550" x2="490" y2="520" class="line"/><line x1="600" y1="550" x2="490" y2="580" class="line"/><line x1="600" y1="550" x2="490" y2="640" class="line"/>

            <!-- Atributos PAGO MATRÍCULA -->
            <line x1="130" y1="520" x2="50" y2="430" class="line"/><line x1="130" y1="520" x2="130" y2="430" class="line"/><line x1="130" y1="520" x2="210" y2="430" class="line"/>

            <!-- Atributos SECRETARIA -->
            <line x1="130" y1="840" x2="50" y2="920" class="line"/><line x1="130" y1="840" x2="210" y2="920" class="line"/>

            <!-- Atributos HISTORIAL -->
            <line x1="1330" y1="550" x2="1450" y2="430" class="line"/><line x1="1330" y1="550" x2="1450" y2="480" class="line"/><line x1="1330" y1="550" x2="1450" y2="530" class="line"/><line x1="1330" y1="550" x2="1450" y2="580" class="line"/><line x1="1330" y1="550" x2="1450" y2="630" class="line"/><line x1="1330" y1="550" x2="1450" y2="680" class="line"/>

            <!-- Atributos EVALUACIÓN PARCIAL -->
            <line x1="1150" y1="850" x2="1030" y2="780" class="line"/><line x1="1150" y1="850" x2="1030" y2="830" class="line"/><line x1="1150" y1="850" x2="1030" y2="880" class="line"/><line x1="1150" y1="850" x2="1030" y2="930" class="line"/>

            <!-- Atributos RECUPERACIÓN -->
            <line x1="1790" y1="850" x2="1910" y2="780" class="line"/><line x1="1790" y1="850" x2="1910" y2="830" class="line"/><line x1="1790" y1="850" x2="1910" y2="880" class="line"/><line x1="1790" y1="850" x2="1910" y2="930" class="line"/>

            <!-- Atributos USUARIO -->
            <line x1="1150" y1="1150" x2="1030" y2="1100" class="line"/><line x1="1150" y1="1150" x2="1030" y2="1150" class="line"/><line x1="1150" y1="1150" x2="1030" y2="1200" class="line"/>

            <!-- Atributos ROL -->
            <line x1="1790" y1="1150" x2="1910" y2="1120" class="line"/><line x1="1790" y1="1150" x2="1910" y2="1180" class="line"/>


            <!-- ========================================================= -->
            <!-- ENTIDADES (RECTÁNGULOS) -->
            <!-- ========================================================= -->
            <g transform="translate(40, 170)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">CARRERA</text></g>
            <g transform="translate(600, 170)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">ESTUDIANTE</text></g>
            <g transform="translate(1150, 170)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">ASIGNATURA</text></g>
            <g transform="translate(1700, 170)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">DOCENTE</text></g>
            <g transform="translate(1910, 450)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">GESTIÓN ACADÉMICA</text></g>

            <g transform="translate(600, 520)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">INSCRIPCIÓN</text></g>
            <g transform="translate(40, 520)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">PAGO MATRÍCULA</text></g>
            <g transform="translate(40, 780)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">SECRETARIA</text></g>

            <g transform="translate(1150, 520)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">HISTORIAL</text></g>
            <g transform="translate(1150, 820)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">EVALUACIÓN PARCIAL</text></g>
            <g transform="translate(1700, 820)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">RECUPERACIÓN</text></g>
            <g transform="translate(1910, 170)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">PRERREQUISITO</text></g>

            <g transform="translate(1150, 1120)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">USUARIO</text></g>
            <g transform="translate(1700, 1120)"><rect width="180" height="60" class="entity"/><text x="90" y="30" class="entity-text">ROL</text></g>


            <!-- ========================================================= -->
            <!-- RELACIONES (ROMBOS) -->
            <!-- ========================================================= -->
            <g transform="translate(410, 200)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">PERTENECE</text></g>
            <g transform="translate(960, 200)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">ESTUDIA</text></g>
            <g transform="translate(1510, 200)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">IMPARTE</text></g>
            <g transform="translate(410, 550)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">REALIZA</text></g>
            <g transform="translate(130, 660)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">REGISTRA</text></g>
            <g transform="translate(960, 550)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">GENERA</text></g>
            <g transform="translate(1510, 850)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">TIENE</text></g>
            <g transform="translate(1240, 1000)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">APLICA</text></g>
            <g transform="translate(1510, 1150)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">TIENE</text></g>
            <g transform="translate(2000, 330)"><polygon points="0,-30 60,0 0,30 -60,0" class="relation"/><text x="0" y="0" class="relation-text">CONTIENE</text></g>


            <!-- ========================================================= -->
            <!-- ATRIBUTOS (ELIPSES) -->
            <!-- ========================================================= -->

            <!-- CARRERA -->
            <ellipse cx="50" cy="90" rx="40" ry="20" class="attribute"/><text x="50" y="90" class="attr-text pk-text">ID</text>
            <ellipse cx="130" cy="80" rx="40" ry="20" class="attribute"/><text x="130" y="80" class="attr-text">Nombre</text>
            <ellipse cx="210" cy="90" rx="40" ry="20" class="attribute"/><text x="210" y="90" class="attr-text">Resolución</text>

            <!-- ESTUDIANTE -->
            <ellipse cx="480" cy="80" rx="35" ry="20" class="attribute"/><text x="480" y="80" class="attr-text pk-text">CI</text>
            <ellipse cx="570" cy="80" rx="40" ry="20" class="attribute"/><text x="570" y="80" class="attr-text">Nombre</text>
            <ellipse cx="650" cy="80" rx="45" ry="20" class="attribute"/><text x="650" y="80" class="attr-text">Ap. Paterno</text>
            <ellipse cx="730" cy="80" rx="40" ry="20" class="attribute"/><text x="730" y="80" class="attr-text">Celular</text>
            <ellipse cx="810" cy="80" rx="40" ry="20" class="attribute"/><text x="810" y="80" class="attr-text">Tipo Est.</text>
            <ellipse cx="900" cy="80" rx="45" ry="20" class="attribute"/><text x="900" y="80" class="attr-text">Estado Acad.</text>

            <!-- ASIGNATURA -->
            <ellipse cx="1100" cy="80" rx="40" ry="20" class="attribute"/><text x="1100" y="80" class="attr-text pk-text">Código</text>
            <ellipse cx="1190" cy="80" rx="40" ry="20" class="attribute"/><text x="1190" y="80" class="attr-text">Nombre</text>
            <ellipse cx="1280" cy="80" rx="40" ry="20" class="attribute"/><text x="1280" y="80" class="attr-text">Horas</text>
            <ellipse cx="1370" cy="80" rx="40" ry="20" class="attribute"/><text x="1370" y="80" class="attr-text">Nivel</text>

            <!-- DOCENTE -->
            <ellipse cx="1680" cy="80" rx="35" ry="20" class="attribute"/><text x="1680" y="80" class="attr-text pk-text">CI</text>
            <ellipse cx="1760" cy="80" rx="40" ry="20" class="attribute"/><text x="1760" y="80" class="attr-text">Nombre</text>
            <ellipse cx="1840" cy="80" rx="45" ry="20" class="attribute"/><text x="1840" y="80" class="attr-text">Especialidad</text>
            <ellipse cx="1920" cy="80" rx="40" ry="20" class="attribute"/><text x="1920" y="80" class="attr-text">Email</text>

            <!-- INSCRIPCIÓN -->
            <ellipse cx="490" cy="460" rx="40" ry="20" class="attribute"/><text x="490" y="460" class="attr-text pk-text">ID</text>
            <ellipse cx="490" cy="520" rx="40" ry="20" class="attribute"/><text x="490" y="520" class="attr-text">Fecha</text>
            <ellipse cx="490" cy="580" rx="40" ry="20" class="attribute"/><text x="490" y="580" class="attr-text">Turno</text>
            <ellipse cx="490" cy="640" rx="40" ry="20" class="attribute"/><text x="490" y="640" class="attr-text">Grupo</text>

            <!-- PAGO MATRÍCULA -->
            <ellipse cx="50" cy="430" rx="40" ry="20" class="attribute"/><text x="50" y="430" class="attr-text pk-text">ID</text>
            <ellipse cx="130" cy="430" rx="45" ry="20" class="attribute"/><text x="130" y="430" class="attr-text">Nro. Comp.</text>
            <ellipse cx="210" cy="430" rx="40" ry="20" class="attribute"/><text x="210" y="430" class="attr-text">Monto</text>

            <!-- SECRETARIA -->
            <ellipse cx="50" cy="920" rx="40" ry="20" class="attribute"/><text x="50" y="920" class="attr-text pk-text">ID</text>
            <ellipse cx="210" cy="920" rx="40" ry="20" class="attribute"/><text x="210" y="920" class="attr-text">Nombre</text>

            <!-- HISTORIAL -->
            <ellipse cx="1450" cy="430" rx="50" ry="20" class="attribute"/><text x="1450" y="430" class="attr-text">Teórico B1</text>
            <ellipse cx="1450" cy="480" rx="50" ry="20" class="attribute"/><text x="1450" y="480" class="attr-text">Práctico B1</text>
            <ellipse cx="1450" cy="530" rx="50" ry="20" class="attribute"/><text x="1450" y="530" class="attr-text">Nota Total</text>
            <ellipse cx="1450" cy="580" rx="50" ry="20" class="attribute"/><text x="1450" y="580" class="attr-text">Nota Final</text>
            <ellipse cx="1450" cy="630" rx="50" ry="20" class="attribute"/><text x="1450" y="630" class="attr-text">Estado</text>
            <ellipse cx="1450" cy="680" rx="55" ry="20" class="attribute"/><text x="1450" y="680" class="attr-text">Observaciones</text>

            <!-- EVALUACIÓN PARCIAL -->
            <ellipse cx="1030" cy="780" rx="40" ry="20" class="attribute"/><text x="1030" y="780" class="attr-text pk-text">ID</text>
            <ellipse cx="1030" cy="830" rx="45" ry="20" class="attribute"/><text x="1030" y="830" class="attr-text">Nro. Parcial</text>
            <ellipse cx="1030" cy="880" rx="45" ry="20" class="attribute"/><text x="1030" y="880" class="attr-text">Nota Teor.</text>
            <ellipse cx="1030" cy="930" rx="45" ry="20" class="attribute"/><text x="1030" y="930" class="attr-text">Nota Prac.</text>

            <!-- RECUPERACIÓN -->
            <ellipse cx="1910" cy="780" rx="40" ry="20" class="attribute"/><text x="1910" y="780" class="attr-text pk-text">ID</text>
            <ellipse cx="1910" cy="830" rx="45" ry="20" class="attribute"/><text x="1910" y="830" class="attr-text">Nota Recup.</text>
            <ellipse cx="1910" cy="880" rx="45" ry="20" class="attribute"/><text x="1910" y="880" class="attr-text">Fecha Rend.</text>
            <ellipse cx="1910" cy="930" rx="45" ry="20" class="attribute"/><text x="1910" y="930" class="attr-text">Estado Final</text>

            <!-- USUARIO -->
            <ellipse cx="1030" cy="1100" rx="40" ry="20" class="attribute"/><text x="1030" y="1100" class="attr-text pk-text">ID</text>
            <ellipse cx="1030" cy="1150" rx="40" ry="20" class="attribute"/><text x="1030" y="1150" class="attr-text">Usuario</text>
            <ellipse cx="1030" cy="1200" rx="40" ry="20" class="attribute"/><text x="1030" y="1200" class="attr-text">Clave</text>

            <!-- ROL -->
            <ellipse cx="1910" cy="1120" rx="40" ry="20" class="attribute"/><text x="1910" y="1120" class="attr-text pk-text">ID</text>
            <ellipse cx="1910" cy="1180" rx="40" ry="20" class="attribute"/><text x="1910" y="1180" class="attr-text">Nombre</text>


            <!-- ========================================================= -->
            <!-- CARDINALIDADES (UBICADAS AFUERA DE LAS ENTIDADES) -->
            <!-- ========================================================= -->
            <!-- PERTENECE -->
            <text x="250" y="190" class="card-text">(1,n)</text>
            <text x="570" y="190" class="card-text">(1,1)</text>

            <!-- ESTUDIA -->
            <text x="810" y="190" class="card-text">(0,n)</text>
            <text x="1120" y="190" class="card-text">(1,n)</text>

            <!-- IMPARTE -->
            <text x="1360" y="190" class="card-text">(1,n)</text>
            <text x="1670" y="190" class="card-text">(1,n)</text>

            <!-- INSCRIPCIÓN -->
            <text x="705" y="250" class="card-text">(1,n)</text>
            <text x="705" y="500" class="card-text">(1,1)</text>

            <!-- REALIZA -->
            <text x="570" y="540" class="card-text">(1,1)</text>
            <text x="250" y="540" class="card-text">(1,n)</text>

            <!-- REGISTRA -->
            <text x="145" y="760" class="card-text">(1,n)</text>
            <text x="145" y="600" class="card-text">(1,1)</text>

            <!-- GENERA -->
            <text x="810" y="540" class="card-text">(1,1)</text>
            <text x="1120" y="540" class="card-text">(1,n)</text>

            <!-- TIENE (Parcial) -->
            <text x="1255" y="600" class="card-text">(1,1)</text>
            <text x="1255" y="800" class="card-text">(1,n)</text>

            <!-- TIENE (Recuperación) -->
            <text x="1360" y="840" class="card-text">(1,1)</text>
            <text x="1670" y="840" class="card-text">(0,1)</text>

            <!-- APLICA -->
            <text x="1255" y="900" class="card-text">(1,1)</text>
            <text x="1255" y="1100" class="card-text">(0,n)</text>

            <!-- TIENE (Rol) -->
            <text x="1360" y="1140" class="card-text">(1,1)</text>

            <!-- CONTIENE -->
            <text x="2015" y="280" class="card-text">(1,1)</text>
            <text x="2015" y="430" class="card-text">(1,n)</text>

        </svg>
    </div>

</body>
</html>
