<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama Entidad-Relación Limpio</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            color: #000000;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 20px;
        }

        .diagram-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 20px 0;
        }

        svg {
            display: block;
            margin: 0 auto;
        }

        /* Estilos en Blanco y Negro */
        .entity {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }

        .entity-text {
            font-size: 16px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .attribute {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.5;
        }

        .attr-text {
            font-size: 13px;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .pk-text {
            text-decoration: underline;
            font-weight: bold;
        }

        .card-text {
            font-size: 15px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
        }

        .line {
            stroke: #000000;
            stroke-width: 2;
        }

        .relation {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }

        .relation-text {
            font-size: 14px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: central;
        }
    </style>
</head>
<body>

    <h1>Diagrama Entidad - Relación (Distribución Ampliada)</h1>

    <div class="diagram-container">
        <svg width="3200" height="2400" viewBox="0 0 3200 2400">

            <!-- ========================================================= -->
            <!-- 1. BLOQUE SUPERIOR: CARRERA - ESTUDIANTE - ASIGNATURA - DOCENTE -->

            <!-- CARRERA -> PERTENECE -> ESTUDIANTE -->

            <!-- ESTUDIANTE (750, 250) -> Atributos -->
